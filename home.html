<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion</title>
<style>
  :root {
    --space: #070416;
    --violet: #7b2ff7;
    --lavender: #c77dff;
    --pink: #ff6ec7;
    --text: #f1eaff;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-edge: rgba(255, 255, 255, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--space);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans", "Ubuntu", system-ui, sans-serif;
  }

  /* ---------- Blurred galaxy background ---------- */
  .galaxy {
    position: fixed;
    inset: -10%;
    background:
      radial-gradient(ellipse 45% 35% at 20% 25%, rgba(123, 47, 247, 0.85), transparent 70%),
      radial-gradient(ellipse 40% 45% at 80% 30%, rgba(255, 110, 199, 0.45), transparent 70%),
      radial-gradient(ellipse 50% 40% at 60% 85%, rgba(76, 29, 160, 0.9), transparent 70%),
      radial-gradient(ellipse 35% 30% at 10% 85%, rgba(199, 125, 255, 0.4), transparent 70%),
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(30, 12, 80, 0.8), transparent 80%),
      var(--space);
    filter: blur(40px);
    animation: drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-2%, -1%) scale(1); }
    to   { transform: translate(2%, 2%) scale(1.08); }
  }

  /* Stars sit on a canvas above the blurred nebula */
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* ---------- Layout ---------- */
  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }

  .clock {
    font-size: clamp(64px, 12vw, 128px);
    font-weight: 200;
    letter-spacing: 0.02em;
    line-height: 1;
    text-shadow: 0 0 40px rgba(199, 125, 255, 0.6);
  }
  .date {
    margin-top: -14px;
    font-size: 18px;
    font-weight: 300;
    color: rgba(241, 234, 255, 0.75);
  }

  /* ---------- Glass ---------- */
  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    box-shadow:
      0 8px 40px rgba(10, 0, 40, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .search {
    width: min(640px, 90vw);
    border-radius: 999px;
    padding: 6px 8px 6px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search:focus-within {
    border-color: var(--lavender);
    box-shadow:
      0 0 0 3px rgba(199, 125, 255, 0.25),
      0 8px 40px rgba(10, 0, 40, 0.45);
  }
  .search input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 18px;
    padding: 12px 0;
  }
  .search input::placeholder { color: rgba(241, 234, 255, 0.55); }
  .search button {
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 15px;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, var(--violet), var(--lavender));
  }
  .search button:hover { filter: brightness(1.15); }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }
  .links a {
    width: 112px;
    padding: 18px 8px 14px;
    border-radius: 20px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
    transition: transform 0.2s, background 0.2s;
  }
  .links a:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.16);
  }
  .links .dot {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    margin: 0 auto 10px;
    border-radius: 50%;
    font-size: 20px;
    font-weight: 600;
    background: linear-gradient(135deg, rgba(123, 47, 247, 0.9), rgba(255, 110, 199, 0.7));
  }

  @media (prefers-reduced-motion: reduce) {
    .galaxy { animation: none; }
  }
</style>
</head>
<body>

<div class="galaxy"></div>
<canvas id="stars"></canvas>

<main>
  <div>
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>
  </div>

  <form class="search glass" id="searchForm">
    <input id="q" type="text" placeholder="Search the web or type an address" autofocus autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <nav class="links">
    <a class="glass" href="https://www.google.com/"><div class="dot">G</div>Google</a>
    <a class="glass" href="https://www.youtube.com/"><div class="dot">Y</div>YouTube</a>
    <a class="glass" href="https://github.com/"><div class="dot">H</div>GitHub</a>
    <a class="glass" href="https://www.wikipedia.org/"><div class="dot">W</div>Wikipedia</a>
  </nav>
</main>

<script>
  // ----- Clock -----
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 1000);

  // ----- Search: address or Google search -----
  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const value = document.getElementById("q").value.trim();
    if (!value) return;
    const looksLikeUrl = /^(https?:\/\/)/i.test(value) || (/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(value));
    if (looksLikeUrl) {
      window.location.href = /^https?:\/\//i.test(value) ? value : "https://" + value;
    } else {
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(value);
    }
  });

  // ----- Twinkling stars -----
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 6000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    }));
  }
  window.addEventListener("resize", resize);
  resize();

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.phase += s.speed;
      const a = reduce ? 0.7 : 0.35 + 0.65 * Math.abs(Math.sin(s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 245, 255, " + a + ")";
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
